[project]
name = "tenhou-analytics"
version = "0.1.0"
description = "天鳳の対局ログを解析し、BigQueryで麻雀成績を分析するツール"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "db-dtypes>=1.7.1",
    "google-cloud-bigquery>=3.20.0",
    "google-cloud-storage>=2.10.0",
    "mahjong>=2.0.0",
    "pandas>=3.0.5",
    "plotly>=7.0.0rc0",
    "pyarrow>=14.0",
    "python-dotenv>=1.2.2",
    "streamlit>=1.61.1",
]

[project.scripts]
tenhou-upload = "tenhou_analytics.cli:main_upload"
tenhou-load = "tenhou_analytics.cli:main_load"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tenhou_analytics"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
src = ["src"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.3",
]
dbt = [
    "dbt-bigquery>=1.9,<1.13; python_version < '3.13'",
]

[tool.uv]
prerelease = "allow"
