version: 2
models:
- name: stg_actions
  description: アクション情報のステージング（raw_actionsの1:1変換）
  columns:
  - name: game_id
    description: 対局ID
    tests:
    - not_null
  - name: round_index
    description: 局のインデックス
    tests:
    - not_null
  - name: action_index
    description: アクションのインデックス（0始まり）
    tests:
    - not_null
  - name: action_type
    description: アクション種別（draw/discard/chi/pon/ankan/daiminkan/kakan/reach/nuki）
  - name: player
    description: プレイヤーの席番号（0-3）
  - name: tile
    description: '牌名（例: 1m, 東, 0p）'
  - name: turn
    description: 巡目
  - name: called_tile
    description: 鳴かれた牌（鳴きアクション時のみ）
  - name: from_who
    description: 鳴き元の相対位置（0=自分(暗槓), 1=下家, 2=対面, 3=上家）
  - name: naki_tiles
    description: 鳴きに含まれる全牌（カンマ区切り）
