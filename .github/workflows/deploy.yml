name: Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write

env:
  GCP_PROJECT_ID: invertible-vine-477701-j8
  GCP_PROJECT_NUMBER: "931431065307"
  GCP_REGION: asia-northeast1
  WIF_PROVIDER: projects/931431065307/locations/global/workloadIdentityPools/github-pool/providers/github-provider
  WIF_SA_EMAIL: github-actions@invertible-vine-477701-j8.iam.gserviceaccount.com
  IMAGE: asia-northeast1-docker.pkg.dev/invertible-vine-477701-j8/tenhou-apps/mahjong-dashboard

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --group dbt

      - name: Ruff lint
        run: uv run ruff check src/ tests/

      - name: Pytest
        run: uv run pytest -v

  deploy:
    needs: lint-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.WIF_SA_EMAIL }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Build and push Docker image
        run: |
          docker build --platform linux/amd64 \
            -t ${{ env.IMAGE }}:${{ github.sha }} \
            -t ${{ env.IMAGE }}:latest \
            apps/mahjong-dashboard/
          docker push ${{ env.IMAGE }}:${{ github.sha }}
          docker push ${{ env.IMAGE }}:latest

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy mahjong-dashboard \
            --image=${{ env.IMAGE }}:${{ github.sha }} \
            --region=${{ env.GCP_REGION }} \
            --project=${{ env.GCP_PROJECT_ID }} \
            --service-account=mahjong-dashboard@${{ env.GCP_PROJECT_ID }}.iam.gserviceaccount.com \
            --set-env-vars="GCP_PROJECT_ID=${{ env.GCP_PROJECT_ID }}" \
            --port=8080 \
            --memory=512Mi \
            --cpu=1 \
            --min-instances=0 \
            --max-instances=1 \
            --allow-unauthenticated \
            --quiet

  dbt-run:
    needs: lint-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --group dbt

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.WIF_SA_EMAIL }}

      - name: dbt deps
        run: cd dbt && uv run --group dbt dbt deps --profiles-dir .

      - name: dbt run
        run: cd dbt && uv run --group dbt dbt run --profiles-dir .
        env:
          GCP_PROJECT_ID: ${{ env.GCP_PROJECT_ID }}

      - name: dbt test
        run: cd dbt && uv run --group dbt dbt test --profiles-dir .
        env:
          GCP_PROJECT_ID: ${{ env.GCP_PROJECT_ID }}
